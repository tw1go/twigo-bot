# The desktop app's installers (packages/desktop): Windows (msi, exe) and Mac (dmg, Apple silicon and Intel), unsigned.
# Since 1.0.0 the app is a window on the live game (twigo.dev/play), with its own version (tauri.conf.json `version`,
# bumped by hand when the app itself changes). So after a successful Deploy it builds only when that version is newer than
# the published one (twigo.dev/downloads/latest.json: the decide job); a game change needs no new app. By hand (Actions →
# Desktop app → Run workflow) it always builds. The files come out as the run's artifacts, and the publish job then signs the Windows setup .exe and the
# Mac app (packed as the update) with the updater's key, writes latest.json and uploads them to
# /opt/twigo-bot/web/downloads on the server (packages/desktop/scripts/publish.mjs, the same as `npm run
# desktop:publish` on the owner's Mac; older versions there go). Open apps then offer "Update now".
#
# Secrets: TAURI_UPDATER_KEY (the owner's ~/.tauri/mikazuki-updater.key, the whole file; never a password), and the
# Deploy workflow's DEPLOY_TARGET / DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS. Without TAURI_UPDATER_KEY the publish job is
# skipped and the artifacts are published by hand as before.
name: Desktop app

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the server (sign, upload, latest.json)
        type: boolean
        default: true

# One at a time; a newer deploy's build waits for the running one.
concurrency:
  group: desktop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decide:
    name: A new app version?
    # After a Deploy only if it succeeded (the site has the same commit); by hand always.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.v.outputs.build }}
      semver: ${{ steps.v.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: packages/desktop/src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false
      - id: v
        name: The app's version against the published one
        shell: bash
        env:
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          semver=$(node -p "require('./packages/desktop/src-tauri/tauri.conf.json').version")
          live=$(curl -sf https://twigo.dev/downloads/latest.json | node -p "(JSON.parse(require('fs').readFileSync(0, 'utf8')).version || '0.0.0').replace(/^v/, '')" 2>/dev/null || echo 0.0.0)
          newer=$(node -p "const n = (v) => v.split('.').map(Number); const [a, b] = [n('$semver'), n('$live')]; let r = false; for (let i = 0; i < 3; i++) if (a[i] !== b[i]) { r = a[i] > b[i]; break; } r")
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          if [ "$BY_HAND" = "true" ] || [ "$newer" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building the app $semver (published: $live)."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "The app's version $semver isn't newer than the published $live: nothing to build."
          fi

  build:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            name: mac
          - platform: windows-latest
            args: ''
            name: windows
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The deployed commit (a workflow_run's checkout would be main's tip, which may have moved on).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target
      # No install scripts: the app's build never loads the bot's better-sqlite3 (only its types, for tsc), whose native
      # build fails on Windows runners (node-gyp can't use their Visual Studio); esbuild's binary comes from its platform
      # package either way.
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Stage the start page into the app
        run: node packages/desktop/scripts/stage.mjs
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop
          tauriScript: npx tauri
          args: ${{ matrix.args }} --config '{"build":{"beforeBuildCommand":""}}'
      - uses: actions/upload-artifact@v4
        with:
          name: mikazuki-${{ matrix.name }}-${{ needs.decide.outputs.semver }}
          path: |
            packages/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            packages/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: [decide, build]
    # A Mac: publish.mjs opens the .dmg (hdiutil) to pack the app as the update.
    runs-on: macos-latest
    timeout-minutes: 15
    if: (github.event_name == 'workflow_run' || inputs.publish) && vars.DESKTOP_PUBLISH != 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts # (for `npx tauri signer`)
      - uses: actions/download-artifact@v4
        with:
          pattern: mikazuki-*-${{ needs.decide.outputs.semver }}
          path: artifacts
      - name: Keys
        env:
          TAURI_UPDATER_KEY: ${{ secrets.TAURI_UPDATER_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$TAURI_UPDATER_KEY" || { echo "::error::TAURI_UPDATER_KEY secret missing: the update can't be signed"; exit 1; }
          install -m 700 -d ~/.tauri ~/.ssh
          printf '%s' "$TAURI_UPDATER_KEY" > ~/.tauri/mikazuki-updater.key # (no newline: the key is one base64 line, and the signer decodes it whole)
          chmod 600 ~/.tauri/mikazuki-updater.key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Publish
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: node packages/desktop/scripts/publish.mjs "$DEPLOY_TARGET" "${{ needs.decide.outputs.semver }}" --from=artifacts
