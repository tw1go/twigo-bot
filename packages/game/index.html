<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mikazuki</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1b26; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; }
      #hud { position: fixed; top: 12px; right: 12px; font: 13px/1.35 system-ui, sans-serif; color: #c0caf5; z-index: 1; }
      .hud-login { display: inline-block; padding: 8px 14px; border-radius: 8px; background: #5865f2; color: #fff; text-decoration: none; font-weight: 600; }
      .hud-login:hover { background: #4752c4; }
      .hud-note { margin-top: 6px; max-width: 220px; color: #f7768e; }
      .hud-card { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(36, 40, 59, 0.92); border: 1px solid #3b4261; }
      .hud-avatar { width: 36px; height: 36px; border-radius: 50%; }
      .hud-name { font-weight: 600; color: #fff; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hud-kowens, .hud-items { color: #a9b1d6; }
      .hud-logout { margin-left: 4px; padding: 4px 8px; border: 1px solid #565f89; border-radius: 6px; background: none; color: #a9b1d6; font: inherit; cursor: pointer; }
      .hud-logout:hover { color: #fff; border-color: #7aa2f7; }
      .hud-prereg { margin-top: 8px; text-align: right; }
      .hud-prereg-join { padding: 7px 12px; border: 0; border-radius: 8px; background: #9ece6a; color: #1a1b26; font: inherit; font-weight: 600; cursor: pointer; }
      .hud-prereg-join:hover { background: #b5e48c; }
      .hud-prereg-join:disabled { opacity: 0.6; cursor: wait; }
      .hud-prereg-done { display: inline-block; padding: 6px 10px; border-radius: 8px; background: rgba(158, 206, 106, 0.15); color: #9ece6a; }
      #coming-soon { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; text-align: center; color: #c0caf5; font: 16px/1.5 system-ui, sans-serif; }
      #coming-soon h1 { margin: 0 0 8px; font-size: 28px; color: #fff; }
      #coming-soon p { margin: 0; max-width: 420px; }
      #coming-soon .hint { margin-top: 12px; color: #9ece6a; font-size: 14px; }
      #wardrobe-button { position: fixed; left: 12px; bottom: 12px; padding: 8px 12px; border: 1px solid #3b4261; border-radius: 8px; background: rgba(36, 40, 59, 0.92); color: #e6e9f2; font: 600 13px system-ui, sans-serif; cursor: pointer; z-index: 1; }
      #wardrobe-button:hover { border-color: #7aa2f7; }
      #wardrobe { position: fixed; left: 12px; bottom: 12px; width: min(440px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; padding: 12px; border: 1px solid #3b4261; border-radius: 10px; background: rgba(26, 27, 38, 0.96); color: #c0caf5; font: 13px/1.4 system-ui, sans-serif; z-index: 2; box-sizing: border-box; }
      #wardrobe .wr-title { font-weight: 700; color: #fff; margin-bottom: 8px; }
      #wardrobe .wr-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0; }
      #wardrobe .wr-label { width: 58px; color: #a9b1d6; }
      #wardrobe .wr-pick { display: inline-flex; align-items: center; gap: 4px; }
      #wardrobe select { max-width: 96px; padding: 3px 4px; border: 1px solid #3b4261; border-radius: 6px; background: #24283b; color: #e6e9f2; font: inherit; }
      #wardrobe .wr-swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #1e1b3a; }
      #wardrobe .wr-note { margin-top: 8px; color: #9ece6a; font-size: 12px; }
      #wardrobe .wr-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
      #wardrobe .wr-actions button { padding: 6px 10px; border: 1px solid #565f89; border-radius: 6px; background: none; color: #c0caf5; font: inherit; cursor: pointer; }
      #wardrobe .wr-actions .wr-save { border: 0; background: #9ece6a; color: #1a1b26; font-weight: 600; }
      #wardrobe .wr-actions button:disabled { opacity: 0.6; cursor: wait; }
      #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); padding: 8px 14px; border-radius: 8px; background: rgba(36, 40, 59, 0.94); border: 1px solid #3b4261; color: #e6e9f2; font: 14px/1.3 system-ui, sans-serif; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 2; }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
      .hud-prereg-note { margin-top: 6px; max-width: 240px; color: #a9b1d6; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
