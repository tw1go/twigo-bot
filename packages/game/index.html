<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mikazuki</title>
    <!-- The crescent moon (public/favicon.ico: 16, 32 and 64 px; the home-screen icon on navy). -->
    <link rel="icon" href="/play/favicon.ico" sizes="16x16 32x32 64x64" />
    <link rel="apple-touch-icon" href="/play/apple-touch-icon.png" />
    <link rel="preload" href="/play/assets/font/Pixelify_Sans/PixelifySans-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      /* Pixelify Sans (SIL OFL 1.1, assets/font/Pixelify_Sans/OFL.txt): one variable file for every weight. */
      @font-face { font-family: 'Pixelify Sans'; src: url('/play/assets/font/Pixelify_Sans/PixelifySans-VariableFont_wght.ttf') format('truetype'); font-weight: 400 700; font-display: swap; }
      /* Numbers in Jersey 10: only the digits come from it (unicode-range), the rest stays Pixelify Sans. */
      @font-face { font-family: 'Marcellus SC'; src: url('/play/assets/font/Marcellus_SC/MarcellusSC-Regular.ttf') format('truetype'); font-weight: 400; font-display: block; } /* the opening title card (ui/title-card.ts) */
      @font-face { font-family: 'Mk Numbers'; src: url('/play/assets/font/Jersey_10/Jersey10-Regular.ttf') format('truetype'); font-weight: 400 700; font-display: swap; unicode-range: U+0030-0039; }
      :root { --ui-font: 'Mk Numbers', 'Pixelify Sans', system-ui, sans-serif; }
      /* The game's cursor (ui/cursor.ts sets these): the pointer everywhere, the hand on links and buttons. */
      body { cursor: var(--cur-pointer, auto); }
      a, button { cursor: var(--cur-hand, pointer); }
      button:disabled { cursor: var(--cur-pointer, default); }
      input, textarea { cursor: text; }
      input[type=range], input[type=checkbox], label.st-row { cursor: var(--cur-hand, pointer); }
      html, body { margin: 0; height: 100%; background: #1a1b26; overflow: hidden; }
      /* Nothing on the page highlights when a drag sweeps over it (the map, the HUD, pop-ups, images); typing fields
         stay selectable, and images never get dragged out as pictures (main.ts stops that drag). */
      body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; }
      img { -webkit-user-drag: none; }
      #game { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; }
      #hud { position: fixed; top: 12px; right: 12px; font: 13px/1.35 var(--ui-font); color: #c0caf5; z-index: 2; }
      .hud-login { display: inline-block; padding: 8px 14px; border-radius: 8px; background: #5865f2; color: #fff; text-decoration: none; font-weight: 600; }
      .hud-login:hover { background: #4752c4; }
      .hud-note { margin-top: 6px; max-width: 220px; color: #f7768e; }
      .hud-card { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(36, 40, 59, 0.92); border: 1px solid #3b4261; }
      .hud-avatar { width: 36px; height: 36px; border-radius: 50%; }
      .hud-name { font-weight: 600; color: #fff; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hud-kowens, .hud-items { color: #a9b1d6; }
      .hud-logout { margin-left: 4px; padding: 4px 8px; border: 1px solid #565f89; border-radius: 6px; background: none; color: #a9b1d6; font: inherit; cursor: var(--cur-hand, pointer); }
      .hud-logout:hover { color: #fff; border-color: #7aa2f7; }
      .hud-prereg { margin-top: 8px; text-align: right; }
      .hud-prereg-join { padding: 7px 12px; border: 0; border-radius: 8px; background: #9ece6a; color: #1a1b26; font: inherit; font-weight: 600; cursor: var(--cur-hand, pointer); }
      .hud-prereg-join:hover { background: #b5e48c; }
      .hud-prereg-join:disabled { opacity: 0.6; cursor: wait; }
      .hud-prereg-done { display: inline-block; padding: 6px 10px; border-radius: 8px; background: rgba(158, 206, 106, 0.15); color: #9ece6a; }
      #boot-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #a9b1d6; font: 14px var(--ui-font); }
      #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); padding: 8px 14px; border-radius: 8px; background: rgba(36, 40, 59, 0.94); border: 1px solid #3b4261; color: #e6e9f2; font: 14px/1.3 var(--ui-font); opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 6; max-width: min(440px, calc(100vw - 32px)); box-sizing: border-box; text-align: center; } /* over pop-ups (their notices), under the Tanod's bust */
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
      #toast.toast-bad { border: 2px solid #F7768E; }
      #toast.toast-good { border: 2px solid #A3E635; }
      #toast.toast-icon { display: flex; align-items: center; gap: 10px; }
      #toast.toast-icon img { width: 32px; height: 32px; image-rendering: pixelated; }
      .hud-prereg-note { margin-top: 6px; max-width: 240px; color: #a9b1d6; }
      #login { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; padding: 16px; background: #000; color: #c0caf5; font: 15px/1.5 var(--ui-font); text-align: center; }
      #login .lg-card { max-width: 360px; }
      #login h1 { margin: 0 0 6px; font-size: 32px; color: #fff; }
      #login p { margin: 0; }
      #login .lg-discord { display: inline-block; margin-top: 22px; padding: 12px 22px; border-radius: 10px; background: #5865f2; color: #fff; text-decoration: none; font-weight: 600; font-size: 16px; }
      #login .lg-discord:hover { background: #4752c4; }
      #login .lg-problem { margin-top: 12px; color: #f7768e; }
      #login .lg-out { margin-top: 20px; padding: 9px 18px; border: 2px solid #3D4256; border-radius: 2px; background: #1E1B3A; color: #c0caf5; font: inherit; }
      #login .lg-out:hover { border-color: #B794F6; }
      #login .lg-hint { margin-top: 14px; color: #565f89; font-size: 13px; }
      #creator { --z: 4; position: fixed; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; padding: 72px 16px 24px; box-sizing: border-box; background: #000; color: #c0caf5; font: 15px/1.4 var(--ui-font); }
      #creator .cr-box { --px: 3; display: flex; flex-direction: column; width: min(960px, 100%); height: min(680px, 100%); border: 1px solid #3b4261; border-radius: 14px; background: #111827; overflow: hidden; box-sizing: border-box; }
      /* The game's item frame as a pixel border: nine-slice, whole-number scale (--px), corners kept sharp. */
      #creator .cr-framed { border-radius: 0; border-style: solid; border-width: calc(var(--slice) * var(--px) * 1px); border-image-source: var(--frame); border-image-slice: var(--slice) fill; border-image-width: calc(var(--slice) * var(--px) * 1px); border-image-repeat: round; image-rendering: pixelated; background: none; }
      #creator .cr-head { padding: 10px 14px 12px; border-bottom: calc(var(--px) * 1px) solid #2A2D3E; }
      #creator h1 { margin: 0 0 4px; font-size: 22px; color: #fff; }
      #creator .cr-head p { margin: 0; color: #a9b1d6; }
      #creator .cr-panel { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(220px, 280px) 1fr; }
      #creator .cr-preview { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px 16px; border-right: calc(var(--px) * 1px) solid #2A2D3E; }
      #creator .cr-stage { position: relative; width: calc(32px * var(--z)); height: calc(48px * var(--z)); }
      #creator .cr-doll { position: relative; width: 100%; height: 100%; image-rendering: pixelated; transition: opacity 0.15s; }
      #creator.cr-busy .cr-doll { opacity: 0.55; }
      #creator .cr-shadow { position: absolute; left: 50%; top: calc(47px * var(--z)); width: calc(18px * var(--z)); height: calc(5px * var(--z)); transform: translate(-50%, -50%); border-radius: 50%; background: rgba(124, 42, 232, 0.22); }
      #creator .cr-stage { margin-top: calc(8px * var(--z)); }
      /* The name and the title under it: 2 art px over the head (--head rows into the cell), at the character's scale. */
      #creator .cr-tag { position: absolute; left: 50%; bottom: calc(100% - (var(--head, 0) - 2) * 1px * var(--z)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: calc(1px * var(--z)); white-space: nowrap; }
      #creator .cr-name { color: #fff; font-size: calc(6px * var(--z)); line-height: calc(7px * var(--z)); text-shadow: 0 0 2px #1E1B3A, 0 0 2px #1E1B3A, 0 0 2px #1E1B3A; }
      #creator .cr-name:empty { display: none; }
      #creator .cr-title { color: #B794F6; font-size: calc(4px * var(--z)); line-height: calc(5px * var(--z)); text-shadow: 0 0 2px #1E1B3A; }
      /* 'prismatic' titles: a rainbow drifting through the text (creator, reward pop-up). */
      .prismatic { background: linear-gradient(90deg, #ff9ad5, #ffd36e, #a6f39a, #7fd8ff, #c7a6ff, #ff9ad5) 0 0 / 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; animation: prism 3s linear infinite; }
      @keyframes prism { to { background-position: -200% 0; } }
      #creator .cr-nick { width: min(100%, 320px); box-sizing: border-box; padding: 9px 12px; border: 2px solid #3D4256; border-radius: 2px; background: #1E1B3A; color: #fff; font: inherit; font-size: 16px; }
      #creator .cr-nick:focus { outline: none; border-color: #B794F6; }
      #creator .cr-nick[aria-invalid='true'] { border-color: #F7768E; }
      #creator .cr-nick-note { margin-top: 8px; color: #7A8099; font-size: 13px; }
      #creator .cr-nick-note.cr-bad { color: #F7768E; }
      #creator .cr-turns { display: flex; gap: 12px; }
      #creator .cr-turn { width: 42px; height: 42px; border: 3px solid #7C2AE8; border-radius: 0; background: #1E1B3A; color: #E6E9F2; font-size: 15px; cursor: var(--cur-hand, pointer); }
      #creator .cr-turn:hover { border-color: #B794F6; }
      #creator .cr-side { display: flex; flex-direction: column; min-height: 0; }
      #creator .cr-settings { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 4px; scrollbar-color: #5B21B6 transparent; }
      #creator .cr-section { padding: 18px 0; }
      #creator .cr-section:first-child { padding-top: 4px; }
      #creator .cr-section + .cr-section, #creator .cr-choices > .cr-section:first-child { padding-top: 18px; border-top: 2px solid #1E1B3A; }
      #creator h2 { margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #B794F6; }
      #creator .cr-items, #creator .cr-swatches { display: flex; flex-wrap: wrap; gap: 8px; }
      #creator .cr-items + .cr-swatches, #creator .cr-items + .cr-sub { margin-top: 16px; }
      #creator .cr-item { padding: 5px 11px; border: 2px solid #3D4256; border-radius: 2px; background: #1E1B3A; color: #c0caf5; font: inherit; cursor: var(--cur-hand, pointer); }
      #creator .cr-item:hover { border-color: #B794F6; }
      #creator .cr-item[aria-checked='true'] { border-color: #B794F6; background: #7C2AE8; color: #fff; font-weight: 600; }
      #creator .cr-swatches { gap: 10px; padding: 4px; margin: -4px; }
      #creator .cr-swatch { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 2px; cursor: var(--cur-hand, pointer); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12); }
      #creator .cr-swatch:hover { transform: scale(1.08); }
      #creator .cr-swatch[aria-checked='true'] { box-shadow: 0 0 0 2px #111827, 0 0 0 5px #A3E635; }
      #creator .cr-sub { display: flex; align-items: flex-start; gap: 12px; margin-top: 12px; }
      #creator .cr-sub-label { width: 48px; flex: none; line-height: 30px; color: #a9b1d6; font-size: 13px; }
      #creator .cr-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 4px; border-top: calc(var(--px) * 1px) solid #2A2D3E; }
      #creator .cr-actions button { padding: 9px 16px; border-radius: 2px; font: inherit; font-weight: 600; cursor: var(--cur-hand, pointer); }
      #creator .cr-random { border: 2px solid #3D4256; background: #1E1B3A; color: #c0caf5; }
      #creator .cr-random:hover { border-color: #B794F6; }
      #creator .cr-save { border: 2px solid #D9F99D; background: #A3E635; color: #1E1B3A; }
      #creator .cr-save:hover { background: #D9F99D; }
      #creator .cr-actions button:disabled { opacity: 0.6; cursor: wait; }
      #creator .cr-note { padding: 4px 16px 0; color: #f7768e; text-align: right; }
      #creator .cr-note:empty { display: none; }
      /* The Parlor: the same box over the dimmed town, with tabs, a close button and titles to pick from. */
      #creator.cr-parlor { z-index: 4; padding: 16px; background: rgba(4, 4, 12, 0.72); animation: rw-dim 0.2s ease-out; }
      #creator.cr-parlor .cr-box { height: min(620px, 100%); }
      #creator .cr-head { position: relative; }
      #creator .cr-wallet { margin: 0; padding-right: 44px; color: #a9b1d6; }
      #creator .cr-close { position: absolute; top: 8px; right: 10px; width: 36px; height: 36px; border: 2px solid #3D4256; border-radius: 2px; background: #1E1B3A; color: #E6E9F2; font: inherit; font-size: 22px; line-height: 1; cursor: var(--cur-hand, pointer); }
      #creator .cr-close:hover { border-color: #B794F6; }
      #creator .cr-tabs { display: flex; gap: 6px; padding: 12px 16px 0; }
      #creator .cr-tab { flex: 1; padding: 8px 10px; border: 2px solid #3D4256; border-bottom: 0; border-radius: 2px 2px 0 0; background: #1E1B3A; color: #a9b1d6; font: inherit; font-weight: 600; cursor: var(--cur-hand, pointer); }
      #creator .cr-tab:hover { color: #fff; }
      #creator .cr-tab[aria-selected='true'] { border-color: #B794F6; background: #7C2AE8; color: #fff; }
      #creator.cr-parlor .cr-settings { border-top: 2px solid #7C2AE8; }
      #creator .cr-titles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 4px; }
      #creator .cr-title-pick { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px; min-height: 96px; padding: 14px; border: 2px solid #3D4256; border-radius: 2px; background: #1E1B3A; font: inherit; text-align: left; cursor: var(--cur-hand, pointer); }
      #creator .cr-title-name { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
      #creator .cr-title-about { color: #7A8099; font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      #creator .cr-tags { order: -1; display: flex; gap: 6px; }
      #creator .cr-new { padding: 2px 8px; border-radius: 2px; background: #A3E635; color: #1E1B3A; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
      #creator .cr-info { position: fixed; z-index: 1; display: flex; flex-direction: column; gap: 4px; width: max-content; max-width: min(280px, calc(100vw - 16px)); padding: 10px 12px; border: 2px solid #B794F6; border-radius: 2px; background: #0B0D17; color: #E6E9F2; font-size: 14px; line-height: 1.35; box-shadow: 0 4px 0 #1E1B3A; pointer-events: none; }
      #creator .cr-info[hidden] { display: none; }
      #creator .cr-info strong { color: #B794F6; font-size: 13px; letter-spacing: 0.04em; }
      #creator .cr-title-pick:hover { border-color: #B794F6; }
      #creator .cr-title-pick[aria-checked='true'] { border-color: #A3E635; box-shadow: inset 0 0 0 1px #A3E635; }
      #creator .cr-worn { flex: none; padding: 2px 8px; border-radius: 2px; background: #2A2D3E; color: #c0caf5; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
      #creator .cr-note.cr-ok { color: #A3E635; }
      #creator .cr-title.prismatic { color: transparent; }
      @media (max-width: 720px) {
        #creator { --z: 3; padding: 124px 8px 8px; } /* below the login card and pre-registration line */
        #creator .cr-box { --px: 2; height: 100%; }
        #creator .cr-head { padding: 6px 10px 10px; }
        #creator .cr-panel { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        #creator .cr-preview { flex-direction: row; gap: 12px; padding: 12px; border-right: 0; border-bottom: calc(var(--px) * 1px) solid #2A2D3E; }
        #creator .cr-preview .cr-turns { display: contents; }
        #creator .cr-preview .cr-turn:first-child { order: -1; }
        #creator .cr-settings { padding: 12px 10px 4px; }
        #creator .cr-actions { padding: 10px 10px 2px; }
        #creator.cr-parlor { padding: 8px; }
        #creator .cr-tabs { padding: 10px 10px 0; }
        #creator .cr-title-pick { min-height: 80px; padding: 10px; }
        /* The house creator: the whole box scrolls (the house goes up out of view), the buttons stay at the bottom. */
        #creator.cr-house:not(.cr-parlor) { padding-top: 72px; }
        #creator.cr-house .cr-box { overflow-y: auto; overscroll-behavior: contain; }
        #creator.cr-house .cr-panel, #creator.cr-house .cr-side { display: block; flex: none; }
        #creator.cr-house .cr-settings { overflow: visible; }
        #creator.cr-house .cr-actions { position: sticky; bottom: 0; z-index: 1; background: #111827; }
        #creator.cr-house .cr-note { background: #111827; }
        #creator .cr-title-name { font-size: 15px; }
      }
      #elsewhere { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.65); color: #c0caf5; font: 15px/1.45 var(--ui-font); text-align: center; }
      #elsewhere .ew-card { max-width: 340px; padding: 20px 22px; border: 3px solid #7C2AE8; background: #111827; }
      #elsewhere h2 { margin: 0 0 8px; font-size: 19px; color: #fff; }
      #elsewhere p { margin: 0; color: #a9b1d6; }
      #revive { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 4, 18, 0.55); color: #c0caf5; font: 15px/1.45 var(--ui-font); text-align: center; }
      #revive .rv-card { min-width: 260px; max-width: 340px; padding: 20px 22px; border: 3px solid #7C2AE8; background: #111827; }
      #revive h2 { margin: 0 0 8px; font-size: 19px; color: #fff; }
      #revive .rv-line { margin: 0; color: #a9b1d6; }
      #revive .rv-count { color: #fff; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
      #revive .rv-now { margin-top: 16px; padding: 10px 20px; border: 2px solid #D9F99D; border-radius: 2px; background: #A3E635; color: #1E1B3A; font: inherit; font-weight: 600; cursor: pointer; }
      #revive .rv-now:disabled { opacity: 0.6; cursor: default; }
      #elsewhere .ew-play { margin-top: 16px; padding: 10px 20px; border: 2px solid #D9F99D; border-radius: 2px; background: #A3E635; color: #1E1B3A; font: inherit; font-weight: 600; }
      #elsewhere .ew-play:hover { background: #D9F99D; }
      #town-hud { font: 15px/1.3 var(--ui-font); color: #E6E9F2; }
      #town-hud .th-left { position: fixed; top: 12px; left: 12px; z-index: 2; } /* the pop-ups are placed against these bars */
      #town-hud .th-profile { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border: 2px solid #7C2AE8; background: #111827; color: inherit; font: inherit; }
      /* The game's item frame as the profile's pixel border, at 2×. */
      #town-hud .th-framed { --px: 2; border-style: solid; border-width: calc(var(--slice) * var(--px) * 1px); border-image-source: var(--frame); border-image-slice: var(--slice) fill; border-image-width: calc(var(--slice) * var(--px) * 1px); border-image-repeat: round; image-rendering: pixelated; background: none; padding: 0 6px 0 0; }
      #town-hud .th-avatar { position: relative; width: 60px; height: 60px; flex: none; }
      #town-hud .th-status { position: absolute; right: 2px; bottom: 2px; image-rendering: pixelated; background-repeat: no-repeat; }
      #town-hud .th-avatar canvas { width: 60px; height: 60px; image-rendering: pixelated; display: block; }
      #town-hud .th-name { font-size: 17px; font-weight: 600; color: #fff; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* Under the name: "Lv N", a thin XP bar (HP and MP bars join .th-bars) and how far along it is; gold and MAX at the cap. */
      #town-hud .th-who { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      #town-hud .th-level { display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 1; color: #A9B1D6; }
      #town-hud .th-level[hidden] { display: none; }
      #town-hud .th-lv { font-size: 16px; font-weight: 600; color: #fff; white-space: nowrap; }
      #town-hud .th-bars { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 76px; }
      #town-hud .th-xp { display: block; height: 4px; padding: 1px; background: #1E1B3A; box-shadow: 0 0 0 1px #4C1D95; }
      #town-hud .th-xp-fill { display: block; height: 100%; background: #A3E635; transition: width 0.4s ease-out; }
      #town-hud .th-max .th-xp-fill { background: #F8BF27; }
      #town-hud .th-xp-text { min-width: 26px; font-size: 13px; text-align: right; }
      #town-hud .th-max .th-xp-text { color: #F8BF27; font-weight: 600; }
