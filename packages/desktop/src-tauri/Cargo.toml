[package]
name = "mikazuki"
version = "0.1.0"
description = "Mikazuki: the desktop app (the game's production build in a window)"
edition = "2021"

[lib]
name = "mikazuki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Updates in the app: download, check the signature against the public key in tauri.conf.json, install, restart.
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# One app at a time: a mikazuki:// login link reaches the window that's already open (on Windows a link starts a
# second copy otherwise).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
